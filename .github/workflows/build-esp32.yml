name: Build ESP32 OTA firmware

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'firmware/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compile ESP32 Dev Module
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --build-property build.partitions=default \
            --output-dir build \
            Daikin_EWAT_ESP32

      - name: Verify OTA binary
        run: |
          ls -lah build
          test -f build/Daikin_EWAT_ESP32.ino.bin

      - name: Prepare GitHub OTA files
        run: |
          mkdir -p firmware
          cp build/Daikin_EWAT_ESP32.ino.bin firmware/Daikin_EWAT_ESP32.ino.bin
          VERSION=$(grep -oP 'FIRMWARE_VERSION = "\K[^"]+' Daikin_EWAT_ESP32/Daikin_EWAT_ESP32.ino)
          echo "$VERSION" > firmware/version.txt
          echo "Publishing firmware version $VERSION"

      - name: Publish latest firmware in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/Daikin_EWAT_ESP32.ino.bin firmware/version.txt
          if git diff --cached --quiet; then
            echo "No firmware changes to commit"
          else
            git commit -m "Publish ESP32 firmware [skip ci]"
            git push
          fi

      - name: Upload OTA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daikin_EWAT_ESP32_OTA
          path: build/Daikin_EWAT_ESP32.ino.bin
          if-no-files-found: error
          retention-days: 7
