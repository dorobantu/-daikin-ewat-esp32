name: Build ESP32 OTA firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compile ESP32 Dev Module
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --build-property build.partitions=default \
            --output-dir build \
            Daikin_EWAT_ESP32

      - name: Verify OTA binary
        run: |
          ls -lah build
          test -f build/Daikin_EWAT_ESP32.ino.bin

      - name: Upload OTA binary
        uses: actions/upload-artifact@v4
        with:
          name: Daikin_EWAT_ESP32_OTA
          path: build/Daikin_EWAT_ESP32.ino.bin
          if-no-files-found: error
          retention-days: 7
